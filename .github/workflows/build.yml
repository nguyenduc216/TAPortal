name: build

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TAPortal.sln

      - name: Build
        run: dotnet build TAPortal.sln --configuration Release --no-restore

      - name: Publish MCP
        run: dotnet publish src/TAPortal.DbMcp/TAPortal.DbMcp.csproj --configuration Release --no-build --output artifacts/mcp
